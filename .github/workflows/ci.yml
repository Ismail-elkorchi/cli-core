name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: ci / node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Core tests
        run: npm run test:core
      - name: Contract tests
        run: npm run test:contracts
      - name: Example tests
        run: npm run test:examples
      - name: Integration tests
        run: npm run build && node --test tests/integration/*.test.mjs
      - name: Security tests
        run: npm run test:security
      - name: Package tests
        run: npm run test:package
      - name: Node runtime
        run: npm run test:runtime:node
      - name: Export check
        run: npm run check:exports
      - name: Public leakage check
        run: npm run check:leakage

  runtime:
    name: ci / runtime-subset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install
        run: npm ci
      - name: Deno runtime
        run: npm run test:runtime:deno
      - name: Bun runtime
        run: npm run test:runtime:bun

  os-runtime:
    name: ci / os-runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: OS runtime smoke
        run: npm run test:runtime:os
      - name: Packed package consumer
        run: npm run test:package

  shells:
    name: ci / shells (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            expected: bash,zsh,fish,pwsh
            install: sudo apt-get update && sudo apt-get install -y zsh fish
          - name: macos
            os: macos-latest
            expected: bash,zsh,pwsh
            install: if ! command -v pwsh >/dev/null 2>&1; then brew install --cask powershell; fi
          - name: windows
            os: windows-latest
            expected: pwsh,cmd
            install: ''
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Install shell dependencies
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}
      - name: Install
        run: npm ci
      - name: Shell smoke
        run: npm run test:shells
        env:
          CLI_CORE_EXPECT_SHELLS: ${{ matrix.expected }}
